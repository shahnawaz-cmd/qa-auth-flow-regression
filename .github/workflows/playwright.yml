      run: |
          START_TIME=$(date +%s)
          npx playwright test --reporter=list,html
          END_TIME=$(date +%s)
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Clean previous HTML report
      run: rm -rf playwright-report/
      
    - name: Run Playwright tests
      run: |
          START_TIME=$(date +%s)
          npx playwright test --reporter=list,html
          END_TIME=$(date +%s)
          echo "DURATION=$((END_TIME - START_TIME))" >> $GITHUB_ENV
      env:
        CI: true

    - name: Send Slack Notification
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        DURATION: ${{ env.DURATION }}
        BATCH_VAL: ${{ matrix.batch }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref_name }}
        GITHUB_SHA_VAL: ${{ github.sha }}
        GITHUB_EVENT: ${{ github.event_name }}
      run: |
        curl -X POST -H 'Content-type: application/json' -d "$(cat <<EOF
        {
          "blocks": [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "🚀 qa-auth-flow-orchestrator – Playwright CI – Batch ${{ env.BATCH_VAL }}",
                "emoji": true
              }
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "Playwright batch ${{ env.BATCH_VAL }} completed in ${{ env.DURATION }} minutes. <${{ env.GITHUB_SERVER }}/${{ env.GITHUB_REPO }}/actions/runs/${{ env.GITHUB_RUN }}|View Workflow Run>"
              }
            }
          ]
        }
        EOF
        )" $SLACK_WEBHOOK_URL

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-batch-${{ matrix.batch }}
        path: |
          playwright-report/
        retention-days: 30
