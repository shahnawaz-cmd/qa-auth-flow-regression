name: Playwright Tests

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Clean previous HTML report
      run: rm -rf playwright-report/
      
    - name: Run Playwright tests
      run: |
          START_TIME=$(date +%s)
          npx playwright test --reporter=html,json
          END_TIME=$(date +%s)
          echo "DURATION=$((END_TIME - START_TIME))" >> $GITHUB_ENV
      env:
        CI: true
        BATCH_ID: ${{ matrix.batch }}
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-batch-${{ matrix.batch }}
        path: playwright-report/
        retention-days: 30

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: playwright-reports-merged
          
      - name: Generate index.html for GitHub Pages
        run: |
          cat << 'EOF' > playwright-reports-merged/index.html
          <!DOCTYPE html>
          <html>
          <head><title>Test Reports</title></head>
          <body style="font-family: sans-serif; padding: 20px;">
            <h2>Playwright Test Reports</h2>
            <ul>
              <li><a href="playwright-report-batch-1/index.html">Batch 1 Report</a></li>
              <li><a href="playwright-report-batch-2/index.html">Batch 2 Report</a></li>
              <li><a href="playwright-report-batch-3/index.html">Batch 3 Report</a></li>
              <li><a href="playwright-report-batch-4/index.html">Batch 4 Report</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-reports-merged
          keep_files: true

      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
        run: node slack-notify.js

      - name: Fail workflow if any batch failed
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "One or more matrix jobs failed."
          exit 1
